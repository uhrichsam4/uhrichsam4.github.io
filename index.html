    <!-- Keep the layout at device width on phones. minimum-scale=1 prevents the accidental
         zoom-out state while still allowing users to zoom in for accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <meta name="robots" content="index, follow" />
    <!-- #FAFAFA is --hx-canvas (src/design/tokens.json), the ground the page actually paints. It was
         #e8e6f5, a lavender from the palette before the 2026-09-05 restyle, so the phone's browser chrome
         was tinted a colour that appears nowhere on the site. The script below sets the same value; this
         static one is what a browser uses in the moment before that script runs. -->
    <meta name="theme-color" content="#FAFAFA" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the theme before first paint (no flash). A stored choice always wins; on a FIRST visit the
         device's own clock decides once, and that decision is written straight back so it can never decide
         again.

         🔴 THIS RUNS HERE, NOT IN REACT, AND THAT IS THE POINT. React boots after first paint, so a night
         visitor would watch the light theme flash white before it swapped. The auto-choice has to be made in
         the same inline script that was already there to prevent exactly that flash.

         🔴 IT IS A ONE-TIME DECISION, NOT A LIVE RULE (owner: "działa tylko na pierwszym wejściu, potem
         zostaje ten motyw który się ustawił"). Writing the result back immediately is what makes it one-time:
         the next load reads a stored value and takes the first branch, so the clock is never consulted again.
         A visitor who flips the toggle is equally final, because the toggle writes the same key.
         There is deliberately NO separate "was this automatic" flag — a second flag is a second thing that
         can disagree with the first.

         Daytime first visits are written too, even though light is already the default. Without that, someone
         who first arrives at 14:00 has nothing stored, and their 22:00 visit would still count as a first one.

         The window is 21:00-06:00 on the DEVICE clock (getHours is local time, so no timezone maths).
         `window.__hmAutoTheme` is set ONLY when the clock actually changed something, i.e. only for dark:
         announcing "light theme applied" when light is already the default is a notification about nothing. -->
    <!-- 🔴 ONE THEME, 2026-09-05 (owner: "disable the light and dark mode switches and make it all one
         theme ... theme like this esactly shades"). This script used to read localStorage and, failing
         that, the CLOCK — dark after 21:00, light otherwise — and the auto choice announced itself through
         window.__hmAutoTheme, which _cssblocks/t3-themetoast.css turns into a toast.
         All of that is gone. It writes light, unconditionally, before first paint.
         ⚠️ localStorage is not read AND NOT WRITTEN. A visitor carrying 'dark' from before today would
         otherwise be served a dark site with no control left to leave it with.
         ⚠️ window.__hmAutoTheme is never set now, so the theme toast can no longer fire. The CSS is left
         in place; it simply has nothing to announce.
         ⚠️ The other two writers of <html data-theme> are src/store.ts and src/hooks/useForcedDark.ts.
         All three say light. Changing one alone gives a flash or a dark island. -->
    <script>
      (function () {
        try {
          document.documentElement.setAttribute('data-theme', 'light');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#FAFAFA');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <!-- 🔴 THE HOMEPAGE'S GROUND, BEFORE REACT EXISTS. Owner 2026-09-05: "remove the white loading foreced
         scren on website load". Dropping the Suspense spinner (App.tsx) is only half of it: the fold's
         gradient hangs off `body.hf-home`, and Home.tsx cannot add that class until the very chunk we are
         waiting for has downloaded — so the wait would still be a white screen, just a white screen with
         nothing on it. Stamping the class here paints the gradient on the FIRST frame, so the visitor sees
         the finished fold and the content simply arrives into it.
         ⚠️ `document.body` DOES NOT EXIST YET at this point in <head>, so this runs on DOMContentLoaded if
         it has to. Both classes are set, matching Home.tsx:1820 exactly — `hx-page` alone changes the bar.
         ⚠️ GUARDED ON THE PATH. On any other route these classes would be wrong, and Home.tsx's cleanup
         (which removes them on unmount) never runs there because Home never mounts.
         ⚠️ Adding a class React later adds again is a no-op, and Home.tsx's unmount cleanup still removes
         both — so navigating away from the homepage clears this exactly as it did before. -->
    <script>
      (function () {
        try {
          if (location.pathname !== '/') return;
          var go = function () {
            if (document.body) document.body.classList.add('hx-page', 'hf-home');
          };
          if (document.body) go();
          else document.addEventListener('DOMContentLoaded', go, { once: true });
        } catch (e) { /* the class is an optimisation; React adds it either way */ }
      })();
    </script>

    <!-- BLANK-PAGE GUARD. Cloudflare Pages serves index.html DYNAMIC (never edge-cached), but for ~a minute
         after a deploy an edge can still hand out the PREVIOUS build's html while the asset manifest is already
         the new one, so the entry chunk it names 404s. Nothing in main.tsx can catch that: if the entry module
         404s, our JS never runs at all, and the visitor gets a white page until they reload by hand. This is the
         "site crashed, had to reload" the owner has hit repeatedly.
         It listens in the CAPTURE phase because a failed script load does not bubble, and reloads ONCE per
         10 seconds (a wall-clock stamp, not a set-once flag) so a genuinely broken deploy cannot spin. The
         reload re-requests index.html and by then the edge has the matching pair. -->
    <script>
      (function () {
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (!el || el.tagName !== 'SCRIPT' || !el.src || el.src.indexOf('/assets/') < 0) return;
          try {
            var k = 'hm_boot_reload', last = +(sessionStorage.getItem(k) || 0);
            if (Date.now() - last < 10000) return; // already tried very recently: let the page fail visibly
            sessionStorage.setItem(k, String(Date.now()));
            var u = new URL(location.href);
            u.searchParams.set('cb', String(Date.now()));
            location.replace(u.toString());
          } catch (_) { /* storage blocked: fail visibly rather than risk a loop */ }
        }, true);
      })();
    </script>

    <!-- Open Graph / social.
         ONE card for the whole site (owner, 2026-08-02): the brand mark in a single ink, centred on white,
         SQUARE. /og-image.png is 1200x1200 (measured, not assumed) and is built by scripts/gen-brand-marks.mjs

         downloads, so the preview never renders as a bare link — and because the card is square, both must say
         1200 or an unfurler letterboxes it into a 1.91:1 slot.
         twitter:card is `summary` (the 1:1 card), NOT summary_large_image: the large card centre-crops to 2:1

         surgeon and every celebrity page — no page carries its own card any more.
         ⚠️ BUMP ?v= HERE AND IN functions/_middleware.js TOGETHER whenever the file changes. Unfurlers (Discord,
